services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=api-user
      - DB_PASSWORD=api-password
      - DB_NAME=api_db
      - DB_PORT=5432
    depends_on:
      - postgres
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=api-user
      - POSTGRES_PASSWORD=api-password
      - POSTGRES_DB=api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
