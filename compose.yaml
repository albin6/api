services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=api_user
      - DB_PASSWORD=api_password
      - DB_NAME=api_db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_SECRET_KEY=supersecretadmin
      - JWT_SECRET=supersecretjwt
    depends_on:
      - postgres
      - redis
    restart: on-failure
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=api_user
      - POSTGRES_PASSWORD=api_password
      - POSTGRES_DB=api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: